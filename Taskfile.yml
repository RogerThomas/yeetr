version: "3"

tasks:
  install:
    desc: Install the virtual environment and install the pre-commit hooks
    cmds:
      - cmd: 'echo "🚀 Creating virtual environment using uv"'
        silent: true
      - uv sync
      - uv run prek install

  deps-lock: uv lock {{.CLI_ARGS}}

  deps-sync: uv sync --all-groups

  check:
    desc: Run code quality tools
    cmds:
      - cmd: 'echo "🚀 Checking lock file consistency with ''pyproject.toml''"'
        silent: true
      - uv --quiet lock --locked
      - cmd: 'echo "🚀 Linting code: Running pre-commit"'
        silent: true
      - uv run prek run -a

  test:
    desc: Test the code with pytest
    cmds:
      - cmd: 'echo "🚀 Testing code: Running pytest"'
        silent: true
      - uv run pytest --cov --cov-config=pyproject.toml --cov-report=xml

  build:
    desc: Build wheel file
    deps: [clean-build]
    cmds:
      - 'echo "🚀 Creating wheel file"'
      - uv build

  clean-build:
    desc: Clean build artifacts
    cmds:
      - cmd: echo "🚀 Removing build artifacts"
        silent: true
      - 'uv run python -c "import shutil; import os; shutil.rmtree(''dist'') if os.path.exists(''dist'') else None"'

  publish:
    desc: 'Publish to PyPI manually (CI publishes automatically via OIDC on release; this is a fallback).'
    cmds:
      - cmd: 'echo "🚀 Publishing."'
        silent: true
      - uv publish

  build-and-publish:
    desc: Build and publish
    cmds:
      - task: build
      - task: publish

  changelog:
    desc: Preview the release notes git-cliff will generate for the next release
    cmds:
      - uv run git-cliff --unreleased --tag "$(uv run yeet ./scripts/next_version.py)"

  release:
    desc: 'Trigger the release workflow on GitHub (CI bumps CalVer, publishes to PyPI, and deploys docs). Nothing runs locally. Usage: task release [-- VERSION]'
    cmds:
      - |
        set -eu
        version="{{.CLI_ARGS}}"
        if [ -n "$version" ]; then
          gh workflow run release.yml --ref main -f version="$version"
        else
          gh workflow run release.yml --ref main
        fi
        echo "Release workflow dispatched. Follow it with:  gh run watch  (or the Actions tab)."

  docs-test:
    desc: Test if documentation can be built without warnings or errors
    cmds:
      - uv run yeet scripts/build_docs.py --strict

  docs:
    desc: Build and serve the documentation
    cmds:
      - uv run yeet scripts/build_docs.py
      - uv run zensical serve
