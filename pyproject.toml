[project]
name = "yeetr"
dynamic = ["version"]
description = "A tiny, typed, signature-driven CLI runner."
authors = [{ name = "yeetr", email = "noreply@example.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ['python']
requires-python = ">=3.13"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["rich>=15.0.0", "rich-argparse>=1.5.2"]

[project.optional-dependencies]
uvloop = ["uvloop>=0.21.0"]

[project.scripts]
yeet = "yeetr._cli:main"

[project.urls]
Homepage = "https://rogerthomas.github.io/yeetr/"
Repository = "https://github.com/RogerThomas/yeetr"
Documentation = "https://rogerthomas.github.io/yeetr/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "pyright>=1.1.380",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocstrings[python]>=1.0.3",
    "prek>=0.4.1",
    "pylint>=3.3.8",
    "zensical>=0.0.45",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The git tag is the single source of truth for the version. A release is just
# a pushed CalVer tag (e.g. 2026.7.2.post1); hatch-vcs derives the version from
# it. Nothing is committed to `main`, so releases never fight branch protection.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["yeetr"]

# Without this, hatchling's sdist default is "every git-tracked file" — which
# published AGENTS.md, docs/, CI config, etc. to PyPI. Ship only the package.
[tool.hatch.build.targets.sdist]
only-include = ["yeetr", "README.md", "LICENSE"]

[tool.pyright]
include = ["yeetr", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "A",   # builtins shadowing
    "ANN", # type annotations
    "ARG", # unused arguments
    "B",   # bugbear (common bugs & bad patterns)
    "BLE", # blind excepts
    "C4",  # comprehensions
    "COM", # commas
    "DTZ", # datetime timezone
    "E",   # pycodestyle errors
    "ERA", # eradicate commented-out code
    "FA",  # future annotations
    "FBT", # boolean trap
    "F",   # pyflakes
    "I",   # import sorting
    "ICN", # import conventions
    "ISC", # implicit str concat
    "N",   # naming conventions
    "PGH", # pygrep-hooks
    "PTH", # pathlib
    "PT",  # pytest style
    "RET", # return statements
    "RUF", # Ruff extra rules
    "TRY", # tryceratops
    "S",   # security
    "SIM", # simplifications
    "C90", # mccabe complexity
    "TID", # tidy imports
    "TC",  # typing under TYPE_CHECKING
    "TD",  # TODOs must be annotated
    "UP",  # pyupgrade / newer syntax
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
    "T10", # debugger statements
]
ignore = ["COM812", "TC006"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "A002",
    "ANN001",
    "S101",   # use of assert detected
]
"yeetr/_runner.py" = ["ANN401", "FBT001", "FBT003", "TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["yeetr"]

[tool.pylint."messages control"]
disable = ["duplicate-code", "no-name-in-module"]

[tool.pylint.basic]
no-docstring-rgx = "^_"

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 20
max-attributes = 20
