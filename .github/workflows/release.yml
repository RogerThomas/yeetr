name: release

# Runs when the release PR (release/next, see release-pr.yml) is merged, or
# when manually dispatched (via `task release`, or the Actions tab). Runs
# entirely in CI. A release is a pushed CalVer *tag* — never a commit to `main` — so it
# never fights branch protection, and the git tag is the sole source of the
# published version (see hatch-vcs config in pyproject.toml).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (leave blank for the next CalVer for today)"
        required: false
        default: ""

jobs:

  # Gate: identical checks to every PR (shared definition), so a broken commit
  # can never be released.
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '/release/next') }}
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  release:
    needs: checks
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no PyPI token. The environment name must match
    # the one configured on the PyPI publisher ("pypi").
    environment:
      name: pypi
      url: https://pypi.org/p/yeetr
    permissions:
      contents: write   # push the release tag and create the GitHub release
      id-token: write   # OIDC token for PyPI Trusted Publishing
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0   # full history + all tags for version derivation

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Determine and create the release tag
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ github.event.inputs.version }}"
          if [ "${{ github.event_name }}" = push ]; then
            version="$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | sed -n 's/^Release //p')"
          fi
          version="${version:-$(uv run yeet scripts/next_version.py)}"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::tag $version already exists"
            exit 1
          fi
          # Tag the current main HEAD locally so hatch-vcs derives the exact
          # version at build time; push + release happen after a clean build.
          git tag -a "$version" -m "Release $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish

      - name: Push tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${{ steps.cut.outputs.version }}"
          uv run git-cliff --latest --strip header --output release-notes.md
          git push origin "refs/tags/$version"
          gh release create "$version" --verify-tag --title "$version" --notes-file release-notes.md

  deploy-docs:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: uv run yeet scripts/build_docs.py --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
